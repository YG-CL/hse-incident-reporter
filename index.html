<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSE Report</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}.wrap{max-width:620px;margin:auto;padding:24px 16px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 4px 18px rgba(0,0,0,.08)}h1{margin:0 0 6px;font-size:28px}.sub{margin:0 0 22px;color:#667085}.location{background:#f1f5f9;border-radius:10px;padding:14px;margin-bottom:20px}.location small{display:block;color:#667085;margin-bottom:4px}.location strong{font-size:18px}label{display:block;font-weight:700;margin:16px 0 7px}select,textarea,input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:9px;font-size:16px;background:#fff}textarea{min-height:120px;resize:vertical}.btn{width:100%;border:0;border-radius:10px;padding:14px;font-size:17px;font-weight:700;cursor:pointer;margin-top:20px}.submit{background:#b42318;color:#fff}.wa{background:#128c7e;color:#fff}.hidden{display:none}.success{background:#ecfdf3;border-radius:10px;padding:14px;margin-top:18px}.hint{font-size:13px;color:#667085;margin-top:6px}.footer{text-align:center;color:#98a2b3;font-size:12px;margin-top:18px}</style>
</head>
<body>
<div class="wrap"><div class="card">
<h1>HSE Report</h1><p class="sub">Quickly report an incident, near miss, or safety observation.</p>
<div class="location"><small>LOCATION</small><strong id="location">Not identified</strong></div>
<label for="type">Report type</label><select id="type"><option>Incident</option><option>Near Miss</option><option>Safety Observation</option><option>Environmental</option><option>Other</option></select>
<label for="severity">Severity</label><select id="severity"><option>Low</option><option>Medium</option><option>High</option><option>Critical</option></select>
<label for="description">Description</label><textarea id="description" placeholder="Briefly describe what happened or what you observed..."></textarea>
<label for="photo">Photo</label><input id="photo" type="file" accept="image/*" capture="environment"><div class="hint">Optional. On a phone, this can open the camera.</div>
<button class="btn submit" onclick="prepareReport()">Submit Report</button>
<div id="success" class="success hidden"><strong>Report prepared.</strong><p>Your report is ready to send to WhatsApp.</p><button class="btn wa" onclick="sendWhatsApp()">Send to WhatsApp</button></div>
</div><div class="footer">HSE Reporting System</div></div>
<script>
const params=new URLSearchParams(location.search);const loc=params.get('location')||'Location not identified';document.getElementById('location').textContent=loc;let message='';
function prepareReport(){const d=document.getElementById('description').value.trim();if(!d){alert('Please enter a description.');return}const type=document.getElementById('type').value,sev=document.getElementById('severity').value;const t=new Date().toLocaleString();message=`🚨 NEW HSE REPORT\n\n📍 Location: ${loc}\n⚠️ Type: ${type}\n🔴 Severity: ${sev}\n📝 Description: ${d}\n🕐 Reported: ${t}`;document.getElementById('success').classList.remove('hidden');document.getElementById('success').scrollIntoView({behavior:'smooth'});}
function sendWhatsApp(){window.location.href='https://wa.me/?text='+encodeURIComponent(message)}
</script></body></html>
