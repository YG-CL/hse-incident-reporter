<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HSE Report</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#17202a;
  min-height:100vh;

  background:
    linear-gradient(
      rgba(235,240,244,0.86),
      rgba(235,240,244,0.90)
    ),
    url('https://images.unsplash.com/photo-1504917595217-d4dc5ebe6122?auto=format&fit=crop&w=2000&q=80')
    center/cover fixed;
}

.wrap{
  max-width:620px;
  margin:auto;
  padding:24px 16px;
}

.card{
  background:rgba(255,255,255,0.91);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  border-radius:18px;
  padding:24px;
  box-shadow:0 8px 30px rgba(0,0,0,.14);
  border:1px solid rgba(255,255,255,0.75);
}

h1{
  margin:0 0 6px;
  font-size:28px;
}

.sub{
  margin:0 0 22px;
  color:#667085;
  line-height:1.45;
}

label{
  display:block;
  font-weight:700;
  margin:16px 0 7px;
}

select,
textarea,
input{
  width:100%;
  padding:13px;
  border:1px solid #d0d5dd;
  border-radius:9px;
  font-size:16px;
  background:rgba(255,255,255,0.96);
}

textarea{
  min-height:120px;
  resize:vertical;
}

.btn{
  width:100%;
  border:0;
  border-radius:10px;
  padding:14px;
  font-size:17px;
  font-weight:700;
  cursor:pointer;
  margin-top:20px;
}

.submit{
  background:#b42318;
  color:#fff;
}

.submit:disabled{
  opacity:.65;
  cursor:not-allowed;
}

.success{
  background:rgba(236,253,243,0.95);
  border-radius:10px;
  padding:14px;
  margin-top:18px;
}

.error{
  background:rgba(254,226,226,0.95);
  border-radius:10px;
  padding:14px;
  margin-top:18px;
  color:#991b1b;
  white-space:pre-wrap;
  word-break:break-word;
}

.hidden{
  display:none;
}

.footer{
  text-align:center;
  color:#475467;
  font-size:12px;
  margin-top:18px;
}

</style>
</head>


<body>

<div class="wrap">

<div class="card">

<h1>HSE Report</h1>

<p class="sub">
Quickly report an incident, hazard, near miss,
fire-related incident, or other HSE concern.
</p>


<form id="hse-form">

<label for="reportLocation">
Location
</label>

<input
  id="reportLocation"
  name="fi-text-reportLocation"
  type="text"
  placeholder="Enter location"
  required
>


<label for="reportType">
Report type
</label>

<select
  id="reportType"
  name="fi-select-reportType"
  required
>

<option value="Incident">Incident</option>
<option value="Hazard">Hazard</option>
<option value="Near Miss">Near Miss</option>
<option value="Fire-related Incident">Fire-related Incident</option>
<option value="Other">Other</option>

</select>


<label for="reportSeverity">
Severity
</label>

<select
  id="reportSeverity"
  name="fi-select-reportSeverity"
  required
>

<option value="Minor">Minor</option>
<option value="Moderate">Moderate</option>
<option value="Major">Major</option>
<option value="Catastrophic">Catastrophic</option>

</select>


<label for="reportDescription">
Description
</label>

<textarea
  id="reportDescription"
  name="fi-text-reportDescription"
  placeholder="Briefly describe what happened or what you observed..."
  required
></textarea>


<button
  id="submitButton"
  class="btn submit"
  type="submit"
>

Submit Report

</button>

</form>


<div
  id="success"
  class="success hidden"
>

<strong>
Report Submitted Successfully
</strong>

<p>
Your HSE report has been received.
</p>

</div>


<div
  id="error"
  class="error hidden"
></div>


</div>


<div class="footer">
HSE Reporting System
</div>

</div>


<script>

const form =
  document.getElementById("hse-form");

const button =
  document.getElementById("submitButton");

const success =
  document.getElementById("success");

const errorBox =
  document.getElementById("error");


form.addEventListener(
  "submit",
  async function(e){

    e.preventDefault();

    button.disabled = true;
    button.textContent = "Submitting...";

    success.classList.add("hidden");
    errorBox.classList.add("hidden");


    try{

      const formData =
        new FormData(form);


      const response =
        await fetch(
          "https://forminit.com/f/2crw9bc8f8i",
          {
            method:"POST",
            body:formData
          }
        );


      const text =
        await response.text();


      console.log(
        "Forminit response:",
        response.status,
        text
      );


      if(!response.ok){

        throw new Error(
          "HTTP " +
          response.status +
          ": " +
          text
        );

      }


      form.classList.add("hidden");

      success.classList.remove("hidden");

      success.scrollIntoView({
        behavior:"smooth"
      });


    }catch(error){

      console.error(error);

      errorBox.textContent =
        "Unable to submit the report.\n\n" +
        error.message;

      errorBox.classList.remove("hidden");

      button.disabled = false;

      button.textContent =
        "Submit Report";

    }

  }
);

</script>

</body>
</html>
